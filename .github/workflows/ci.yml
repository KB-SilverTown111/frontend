name: Frontend CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Git Flow branches
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          branch_pattern='^(feat|fix|hotfix)/[a-z0-9]+([/-][a-z0-9]+)*$'

          if [[ "$BASE_BRANCH" == "dev" && "$HEAD_BRANCH" =~ $branch_pattern ]]; then
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "main" && ( "$HEAD_BRANCH" == "dev" || "$HEAD_BRANCH" =~ ^hotfix/[a-z0-9]+([/-][a-z0-9]+)*$ ) ]]; then
            exit 0
          fi

          echo "허용되지 않는 브랜치 흐름입니다: $HEAD_BRANCH -> $BASE_BRANCH"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
